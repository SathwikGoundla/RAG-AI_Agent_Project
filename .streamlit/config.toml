# Streamlit Configuration for Advanced RAG Platform

[theme]
primaryColor = "#667eea"
backgroundColor = "#f5f7f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "info"

# Backend Configuration (set in .env or environment variables)
backend_url = "http://localhost:8000"
